<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Marvel Puzzle Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- HOME SCREEN -->
  <main id="homeScreen" class="screen home">
    <button id="settingsBtn" class="icon-btn" aria-label="Settings" type="button">
      <img src="assets/ui/Preference.png" alt="" />
    </button>

    <div class="home-content">
      <img class="home-logo" src="assets/ui/logo.png" alt="Marvel Puzzle Game" />

      <button id="playBtn" class="img-btn" type="button" aria-label="Play">
        <img src="assets/ui/Play.png" alt="PLAY" />
      </button>

      <button id="chooseLevelBtn" class="img-btn" type="button" aria-label="Choose Level" disabled>
        <img src="assets/ui/ChooseLevel.png" alt="CHOOSE LEVEL" />
      </button>
    </div>
  </main>

  <!-- GAME SCREEN -->
  <main id="gameScreen" class="screen game hidden">
    <div class="game-top">
      <button id="backBtn" class="text-btn" type="button">← Back</button>
    </div>

    <div id="puzzleWrap">
      <div id="puzzle"></div>

      <div id="winMessage" class="win" style="display:none;">YOU WON!</div>
      <button id="nextLevelBtn" class="next" style="display:none;" type="button">NEXT LEVEL</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
